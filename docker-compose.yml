# Local only — na VPS use Postgres/Redis compartilhados do Coolify
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas_template
    ports:
      - "5435:5432"
    volumes:
      - saas_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  saas_pg:
